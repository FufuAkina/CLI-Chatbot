<!DOCTYPE html>
<html>

<head>
    <title>My Chatbot</title>
</head>

<body>

    <h1>My AI Chatbot</h1>

    <input id="messageInput" type="text">

    <button onclick="sendMessage()">
        Send
    </button>

    <div id="chatBox"></div>

    <script>

        let sessionId = null

        async function sendMessage() {

            const input = document.getElementById("messageInput")
            const message = input.value

            if (!message) return

            input.value = ""

            const chatBox = document.getElementById("chatBox")

            // =========================
            // 1. 显示用户消息
            // =========================
            const userMsg = document.createElement("p")
            const userLabel = document.createElement("b")
            userLabel.textContent = "你: "
            const userText = document.createElement("span")
            userText.textContent = message
            userMsg.appendChild(userLabel)
            userMsg.appendChild(userText)
            chatBox.appendChild(userMsg)

            // =========================
            // 2. 创建 AI 容器
            // =========================
            const aiMsg = document.createElement("p")

            const label = document.createElement("b")
            label.textContent = "AI: "

            const aiSpan = document.createElement("span")

            aiMsg.appendChild(label)
            aiMsg.appendChild(aiSpan)

            chatBox.appendChild(aiMsg)

            // =========================
            // 3. 请求 stream（带 session_id）
            // =========================
            const requestBody = { message: message }
            if (sessionId) {
                requestBody.session_id = sessionId
            }

            const response = await fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(requestBody)
            })

            const reader = response.body.getReader()
            const decoder = new TextDecoder()

            // =========================
            // 4. streaming 写入
            // =========================
            let isFirstChunk = true

            while (true) {

                const { done, value } = await reader.read()
                if (done) break

                const chunk = decoder.decode(value)

                // 第一个 chunk 可能包含 SESSION_ID
                if (isFirstChunk && chunk.startsWith("SESSION_ID:")) {
                    const lines = chunk.split("\n")
                    sessionId = lines[0].replace("SESSION_ID:", "")
                    // 剩余内容作为 AI 回复
                    if (lines.length > 1) {
                        aiSpan.textContent += lines.slice(1).join("\n")
                    }
                    isFirstChunk = false
                } else {
                    aiSpan.textContent += chunk
                }
            }
        }

    </script>

</body>

</html>
