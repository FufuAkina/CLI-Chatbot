<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
        }

        .role-selector {
            padding: 15px 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            flex-wrap: wrap;
        }

        .role-btn {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .role-btn:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .role-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .custom-prompt-area {
            padding: 15px 20px;
            background: #f9f9f9;
            border-bottom: 1px solid #e0e0e0;
            display: none;
        }

        .custom-prompt-area.show {
            display: block;
        }

        .custom-prompt-area textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .custom-prompt-area textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .custom-prompt-area button {
            margin-top: 10px;
            padding: 8px 20px;
            font-size: 14px;
        }

        #chatBox {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f7f7f7;
        }

        #chatBox::-webkit-scrollbar {
            width: 8px;
        }

        #chatBox::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        #chatBox::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        #chatBox::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message b {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .user-message b {
            color: #667eea;
        }

        .ai-message b {
            color: #764ba2;
        }

        .message span {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .user-message span {
            background: #667eea;
            color: white;
        }

        .ai-message span {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .error-message span {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef5350;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        #messageInput:focus {
            border-color: #667eea;
        }

        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #clearBtn {
            background: #f44336;
            padding: 12px 20px;
        }

        #clearBtn:hover {
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            🤖 AI Chatbot
        </div>

        <div class="role-selector" id="roleSelector">
            <!-- 角色按钮将通过 JavaScript 动态加载 -->
        </div>

        <div class="custom-prompt-area" id="customPromptArea">
            <textarea id="customPromptInput" placeholder="输入自定义 System Prompt，例如：你是一个专业的法律顾问..."></textarea>
            <button onclick="applyCustomPrompt()">应用自定义角色</button>
        </div>

        <div id="chatBox"></div>

        <div class="input-area">
            <input id="messageInput" type="text" placeholder="输入消息...">
            <button onclick="sendMessage()">发送</button>
            <button id="clearBtn" onclick="clearChat()">清空</button>
        </div>
    </div>

    <script>

        let sessionId = null
        let currentRole = "default"
        let customPrompt = null

        // 加载角色列表
        async function loadRoles() {
            try {
                const response = await fetch("/roles")
                const data = await response.json()
                const roleSelector = document.getElementById("roleSelector")

                data.roles.forEach(role => {
                    const btn = document.createElement("button")
                    btn.className = "role-btn"
                    btn.textContent = `${role.icon} ${role.name}`
                    btn.title = role.description
                    btn.onclick = () => selectRole(role.key, btn)

                    if (role.key === "default") {
                        btn.classList.add("active")
                    }

                    roleSelector.appendChild(btn)
                })

                // 添加自定义角色按钮
                const customBtn = document.createElement("button")
                customBtn.className = "role-btn"
                customBtn.textContent = "⚙️ 自定义"
                customBtn.title = "输入自定义 System Prompt"
                customBtn.onclick = () => toggleCustomPrompt(customBtn)
                roleSelector.appendChild(customBtn)

            } catch (error) {
                console.error("加载角色失败:", error)
            }
        }

        // 切换自定义 Prompt 区域
        function toggleCustomPrompt(btnElement) {
            const customArea = document.getElementById("customPromptArea")
            customArea.classList.toggle("show")

            if (customArea.classList.contains("show")) {
                document.getElementById("customPromptInput").focus()
            }
        }

        // 应用自定义 Prompt
        function applyCustomPrompt() {
            const input = document.getElementById("customPromptInput")
            const prompt = input.value.trim()

            if (!prompt) {
                alert("请输入 System Prompt")
                return
            }

            customPrompt = prompt
            currentRole = "custom"
            sessionId = null

            document.querySelectorAll(".role-btn").forEach(btn => {
                btn.classList.remove("active")
            })
            document.querySelector(".role-btn:last-child").classList.add("active")

            document.getElementById("customPromptArea").classList.remove("show")
            document.getElementById("chatBox").innerHTML = ""

            alert("自定义角色已应用！")
        }

        // 选择角色
        function selectRole(roleKey, btnElement) {
            currentRole = roleKey
            sessionId = null

            document.querySelectorAll(".role-btn").forEach(btn => {
                btn.classList.remove("active")
            })
            btnElement.classList.add("active")

            document.getElementById("chatBox").innerHTML = ""
        }

        // 自动滚动到底部
        function scrollToBottom() {
            const chatBox = document.getElementById("chatBox")
            chatBox.scrollTop = chatBox.scrollHeight
        }

        // 清空对话
        function clearChat() {
            if (confirm("确定要清空对话吗？")) {
                document.getElementById("chatBox").innerHTML = ""
                sessionId = null
            }
        }

        // Enter 键发送
        document.addEventListener('DOMContentLoaded', function() {
            loadRoles()

            const input = document.getElementById("messageInput")
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage()
                }
            })
        })

        async function sendMessage() {

            const input = document.getElementById("messageInput")
            const message = input.value.trim()

            if (!message) {
                alert("请输入消息")
                return
            }

            if (message.length > 4000) {
                alert("消息长度不能超过 4000 字符")
                return
            }

            input.value = ""

            const chatBox = document.getElementById("chatBox")

            // =========================
            // 1. 显示用户消息
            // =========================
            const userMsg = document.createElement("div")
            userMsg.className = "message user-message"

            const userLabel = document.createElement("b")
            userLabel.textContent = "你"

            const userText = document.createElement("span")
            userText.textContent = message

            userMsg.appendChild(userLabel)
            userMsg.appendChild(userText)
            chatBox.appendChild(userMsg)

            scrollToBottom()

            // =========================
            // 2. 创建 AI 容器
            // =========================
            const aiMsg = document.createElement("div")
            aiMsg.className = "message ai-message"

            const label = document.createElement("b")
            label.textContent = "AI"

            const aiSpan = document.createElement("span")

            aiMsg.appendChild(label)
            aiMsg.appendChild(aiSpan)

            chatBox.appendChild(aiMsg)

            scrollToBottom()

            try {
                // =========================
                // 3. 请求 stream（带 session_id）
                // =========================
                const requestBody = { message: message }
                if (sessionId) {
                    requestBody.session_id = sessionId
                }
                requestBody.role = currentRole

                // 如果是自定义角色，发送自定义 prompt
                if (currentRole === "custom" && customPrompt) {
                    requestBody.custom_prompt = customPrompt
                }

                // 添加超时控制
                const controller = new AbortController()
                const timeoutId = setTimeout(() => controller.abort(), 60000)

                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(requestBody),
                    signal: controller.signal
                })

                clearTimeout(timeoutId)

                if (!response.ok) {
                    throw new Error(`HTTP错误: ${response.status}`)
                }

                const reader = response.body.getReader()
                const decoder = new TextDecoder()

                // =========================
                // 4. streaming 写入
                // =========================
                let isFirstChunk = true
                let hasReceivedData = false
                let lastChunkTime = Date.now()

                const streamTimeout = setInterval(() => {
                    if (hasReceivedData && Date.now() - lastChunkTime > 30000) {
                        clearInterval(streamTimeout)
                        reader.cancel()
                        if (!aiSpan.textContent) {
                            aiMsg.className = "message error-message"
                            aiSpan.textContent = "连接超时，请检查网络"
                        }
                    }
                }, 5000)

                while (true) {

                    const { done, value } = await reader.read()
                    if (done) {
                        clearInterval(streamTimeout)
                        break
                    }

                    hasReceivedData = true
                    lastChunkTime = Date.now()

                    const chunk = decoder.decode(value)

                    // 检查是否是错误消息
                    if (chunk.startsWith("ERROR:")) {
                        clearInterval(streamTimeout)
                        aiMsg.className = "message error-message"
                        aiSpan.textContent = chunk.replace("ERROR:", "")
                        break
                    }

                    // 第一个 chunk 可能包含 SESSION_ID
                    if (isFirstChunk && chunk.startsWith("SESSION_ID:")) {
                        const lines = chunk.split("\n")
                        sessionId = lines[0].replace("SESSION_ID:", "")
                        // 剩余内容作为 AI 回复
                        if (lines.length > 1) {
                            aiSpan.textContent += lines.slice(1).join("\n")
                        }
                        isFirstChunk = false
                    } else {
                        aiSpan.textContent += chunk
                    }

                    scrollToBottom()
                }

            } catch (error) {
                aiMsg.className = "message error-message"
                if (error.name === 'AbortError') {
                    aiSpan.textContent = "请求超时，请检查网络连接"
                } else {
                    aiSpan.textContent = `网络错误: ${error.message}`
                }
            }

            scrollToBottom()
        }

    </script>

</body>

</html>
